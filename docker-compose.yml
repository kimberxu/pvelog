services:
  controller:
    # 默认拉取 GHCR 镜像，不在本地构建
    image: ghcr.io/kimberxu/pvelog/controller:latest
    # 本地开发需要重新构建时，取消下面注释：
    # build:
    #   context: ./controller
    #   dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      # 进程活着但事件循环卡死时 restart 不会触发，healthcheck 才能发现并重启
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:42791/api/v1/config', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app
    volumes:
      # SQLite 数据库持久化（独立于源码目录，生产可用 ./data 直接备份/迁移）
      - ./data:/var/lib/pve-aiops
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      # 覆盖 .env 中的相对路径，数据库固定在数据卷内
      - DB_URL=sqlite+aiosqlite:////var/lib/pve-aiops/pve_aiops.db
    ports:
      - "42791:42791"
    env_file:
      - .env
    extra_hosts:
      - "h110:192.168.1.10"  # 替换成 PVE 节点 h110 真实的局域网 IP
      - "pve:192.168.1.11"
      - "songyuan:192.168.2.10"
